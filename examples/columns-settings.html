<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Settings — Shibui columns</title>
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/components.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <!-- The application navigation and current task share the outer grid. -->
    <div class="app-shell" data-column-divider>
      <aside class="app-sidebar" aria-label="Workspace">
        <div>
          <a class="brand" href="../index.html">Acme</a>
          <p class="meta">Design workspace</p>
        </div>
        <nav class="app-nav" aria-label="Workspace navigation">
          <a href="columns.html">Projects</a>
          <a href="tool.html">Allocation</a>
          <a href="columns-settings.html" aria-current="page">Settings</a>
        </nav>
        <div class="app-identity">
          <strong>Haru K.</strong>
          <span class="meta">haru@acme.example</span>
          <a href="../index.html">Shibui examples</a>
        </div>
      </aside>
      <main id="main" class="app-main" tabindex="-1">
        <header class="app-page-header">
          <h1>Settings</h1>
          <p class="meta" id="preview-note">
            Try the controls. This reference form does not save changes.
          </p>
        </header>
        <!-- A nested grid adds section navigation without another surface. -->
        <div class="settings-columns" data-column-divider>
          <nav class="section-nav" aria-label="Settings sections">
            <a href="#general">General</a>
            <a href="#preferences">Preferences</a>
          </nav>
          <div class="settings-content" aria-describedby="preview-note">
            <section id="general" aria-labelledby="general-title">
              <h2 id="general-title">General</h2>
              <div class="setting-row">
                <label for="organization">Organization name</label>
                <input
                  id="organization"
                  name="organization"
                  value="Acme"
                  autocomplete="organization"
                />
              </div>
              <div class="setting-row">
                <label for="website">Website</label>
                <input
                  id="website"
                  name="website"
                  type="url"
                  value="https://acme.example.com"
                />
              </div>
              <div class="setting-row">
                <label for="visibility">Default visibility</label>
                <select id="visibility" name="visibility">
                  <option>Private</option>
                  <option>Workspace</option>
                  <option>Public</option>
                </select>
              </div>
            </section>
            <section id="preferences" aria-labelledby="preferences-title">
              <h2 id="preferences-title">Preferences</h2>
              <label class="setting-toggle" for="digest">
                <span>Weekly digest</span>
                <input id="digest" name="digest" type="checkbox" checked />
              </label>
              <label class="setting-toggle" for="updates">
                <span>Product updates</span>
                <input id="updates" name="updates" type="checkbox" />
              </label>
            </section>
          </div>
        </div>
        <footer class="footer">
          Three columns · Workspace navigation, section navigation, and settings
        </footer>
      </main>
    </div>
  </body>
</html>
